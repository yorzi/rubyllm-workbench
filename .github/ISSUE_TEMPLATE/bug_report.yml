name: Bug report
description: Something in the workbench behaves differently than documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not include API keys, credentials or private data. For security issues, use
        the Security tab's "Report a vulnerability" instead of a public issue.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Steps from a fresh checkout, ideally using `bin/rails workbench:demo` or a fake provider.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Run status, Attempt error, lifecycle events, or a redacted reproduction JSON (review it before pasting).
  - type: input
    id: provider
    attributes:
      label: Provider and model (if a live call was involved)
  - type: input
    id: version
    attributes:
      label: Commit or release
    validations:
      required: true
